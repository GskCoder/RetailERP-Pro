# Render deployment blueprint for RetailERP Backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: retailerp-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false  # Set to your Vercel URL
      - key: PYTHON_VERSION
        value: 3.11.9
